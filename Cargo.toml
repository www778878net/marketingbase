[package]
name = "marketingbase"
version = "0.1.0"
edition = "2021"
description = "Marketing base traits and types"

[dependencies]
chromiumoxide = { version = "0.7", features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
datastate = { git = "https://github.com/www778878net/datastate.git" }
base = { git = "https://github.com/www778878net/rustbase.git" }
chrono = { version = "0.4", features = ["serde"] }
